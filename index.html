<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#2b1d10">
  <title>ねこねこ大戦争</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="top-hud">
      <button class="hud-btn" id="back-btn" type="button" aria-label="戻る">←</button>
      <div class="hud-title"><small id="hud-sub">STAGE SELECT</small><strong id="hud-title">日本編 第1章</strong></div>
      <div class="hud-right">
        <div class="pill"><span>XP</span><b id="xp-label">1200</b></div>
        <div class="pill gold"><span>NP</span><b id="np-label">50</b></div>
      </div>
    </header>

    <main class="screens">
      <section class="screen active" id="screen-title" data-screen="title">
        <div class="title-card">
          <p class="logo-sub">NEKO NEKO GREAT WAR</p>
          <h1>ねこねこ<br><span>大戦争</span></h1>
          <div class="title-cats" aria-hidden="true">🐱 ⚔️ 🐶</div>
          <button class="big-btn" data-go="stages">スタート</button>
          <button class="big-btn alt" data-go="upgrade">にゃんこガチャ/強化</button>
          <p class="title-note">※オリジナル作品のブラウザ版デモです</p>
        </div>
      </section>

      <section class="screen" id="screen-stages" data-screen="stages">
        <div class="panel-head">
          <h2>ステージ選択</h2>
          <p>敵城を叩け！お金を貯めてネコを生産！</p>
        </div>
        <div class="stage-list" id="stage-list"></div>
      </section>

      <section class="screen" id="screen-upgrade" data-screen="upgrade">
        <div class="panel-head">
          <h2>基本キャラ強化</h2>
          <p>XPを使ってレベルアップ。編成画面で出撃設定。</p>
        </div>
        <div class="upgrade-list" id="upgrade-list"></div>
      </section>

      <section class="screen" id="screen-equip" data-screen="equip">
        <div class="panel-head">
          <h2>編成</h2>
          <p>出撃スロット（最大5体）を選択</p>
        </div>
        <div class="equip-slots" id="equip-slots"></div>
        <div class="equip-pool" id="equip-pool"></div>
        <button class="big-btn" data-go="stages">決定</button>
      </section>

      <section class="screen battle-screen" id="screen-battle" data-screen="battle">
        <div class="battle-top">
          <div class="base-hp enemy"><span>敵城</span><div class="bar"><i id="enemy-hp-bar"></i></div></div>
          <button class="speed-btn" id="speed-btn" type="button">▶×1</button>
          <button class="pause-btn" id="pause-btn" type="button">Ⅱ</button>
        </div>
        <div class="battle-wrap">
          <canvas id="game" width="1280" height="420"></canvas>
          <div class="battle-overlay" id="battle-overlay"></div>
        </div>
        <div class="battle-bottom">
          <div class="money-row">
            <div class="wallet">
              <div class="wallet-label">所持金 <b id="money-label">0</b> / <span id="wallet-max">1000</span></div>
              <div class="wallet-bar"><i id="money-bar"></i></div>
            </div>
            <button class="worker-btn" id="worker-btn" type="button">
              <strong>働きネコ Lv.<span id="worker-lv">1</span></strong>
              <small>レベルUP <b id="worker-cost">100</b>円</small>
            </button>
            <button class="cannon-btn" id="cannon-btn" type="button">
              <strong>ネコカンノン</strong>
              <div class="cannon-charge"><i id="cannon-bar"></i></div>
            </button>
          </div>
          <div class="deploy-row" id="deploy-row"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav" id="bottom-nav">
      <button class="nav-btn active" data-go="stages"><i>🗺</i><span>ステージ</span></button>
      <button class="nav-btn" data-go="equip"><i>📋</i><span>編成</span></button>
      <button class="nav-btn" data-go="upgrade"><i>⬆</i><span>強化</span></button>
    </nav>
  </div>
  <script src="app.js"></script>
</body>
</html>
