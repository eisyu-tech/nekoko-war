<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#120c06">
  <title>しろくろねこ大戦線</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="rotate-hint" aria-hidden="true">横向きでプレイ推奨</div>

    <section id="screen-title" class="screen active">
      <div class="title-bg"></div>
      <div class="title-ui">
        <div class="logo">
          <div class="logo-sub">SHIROKURO NEKO FRONTLINE</div>
          <h1>しろくろ<br><span>ねこ大戦線</span></h1>
        </div>
        <div class="menu-buttons">
          <button class="menu-btn primary" data-nav="stages">戦闘開始（出陣）</button>
          <button class="menu-btn" data-nav="upgrade">パワーアップ</button>
          <button class="menu-btn" data-nav="equip">キャラ編成</button>
        </div>
        <div class="title-footer">
          <button id="mute-btn-title" class="mini-btn">♪ ON</button>
          <span class="note">オリジナル手描き風ゲーム</span>
        </div>
      </div>
    </section>

    <section id="screen-stages" class="screen">
      <header class="sub-header">
        <button class="back-btn" data-nav="title">←もどる</button>
        <h2>日本編ステージ選択</h2>
        <div class="xp-badge">XP <b id="xp-stages">0</b></div>
      </header>
      <div class="map-area">
        <svg class="japan-map" viewBox="0 0 400 260" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
          <rect x="0" y="0" width="400" height="260" fill="#bfe6ff"/>
          <ellipse cx="200" cy="210" rx="170" ry="30" fill="#8fd3ff" opacity=".6"/>
          <path d="M120 70 L170 40 L230 50 L270 80 L310 70 L330 110 L300 150 L320 190 L260 210 L210 180 L170 200 L120 170 L90 130 Z" fill="#7ed957" stroke="#3f7a2a" stroke-width="4"/>
        </svg>
        <div id="stage-nodes" class="stage-nodes"></div>
      </div>
    </section>

    <section id="screen-upgrade" class="screen">
      <header class="sub-header">
        <button class="back-btn" data-nav="title">←もどる</button>
        <h2>パワーアップ</h2>
        <div class="xp-badge">XP <b id="xp-upgrade">0</b></div>
      </header>
      <div class="upgrade-tabs">
        <button class="tab active" data-tab="units">キャラ</button>
        <button class="tab" data-tab="base">お城・砲</button>
      </div>
      <div id="upgrade-list-units" class="list-pane active"></div>
      <div id="upgrade-list-base" class="list-pane"></div>
    </section>

    <section id="screen-equip" class="screen">
      <header class="sub-header">
        <button class="back-btn" data-nav="title">←もどる</button>
        <h2>キャラ編成</h2>
        <div class="xp-badge">出撃枠 <b id="slot-count">0</b>/5</div>
      </header>
      <div class="equip-top"><div id="equip-slots" class="equip-slots"></div></div>
      <div id="equip-pool" class="equip-pool"></div>
      <div class="equip-bottom"><button class="menu-btn primary" data-nav="stages">決定して出陣へ</button></div>
    </section>

    <section id="screen-battle" class="screen">
      <div class="battle-topbar">
        <div class="hud-left">
          <button id="pause-btn" class="hud-circle" title="一時停止">Ⅱ</button>
          <button id="speed-btn" class="hud-circle" title="倍速">▶1</button>
          <button id="zoom-btn" class="hud-circle wide" title="ズーム切替">全体</button>
          <button id="mute-btn-battle" class="hud-circle small" title="ミュート">♪</button>
        </div>
        <div class="hud-center">
          <div class="stage-name" id="battle-stage-name">ステージ</div>
          <div class="minimap" id="minimap">
            <div class="mm-base mm-cat"></div>
            <div class="mm-base mm-enemy"></div>
            <div class="mm-view" id="mm-view"></div>
            <div class="mm-dots" id="mm-dots"></div>
          </div>
        </div>
        <div class="hud-right">
          <div class="money-box">
            <div class="money-label">MONEY</div>
            <div class="money-value"><span id="money-now">0</span><small> / </small><span id="money-max">0</span><small>円</small></div>
          </div>
        </div>
      </div>

      <div class="battle-field-wrap" id="battle-wrap">
        <canvas id="battle-canvas" width="1000" height="520"></canvas>
        <div id="battle-msg" class="battle-msg"></div>
        <div id="result-overlay" class="result-overlay">
          <div class="result-card">
            <h3 id="result-title">勝利！</h3>
            <p id="result-desc"></p>
            <div class="result-actions">
              <button class="menu-btn" data-nav="stages">ステージ選択</button>
              <button class="menu-btn primary" id="retry-btn">もう一度</button>
            </div>
          </div>
        </div>
      </div>

      <div class="battle-controls">
        <div class="ctrl-left">
          <button id="worker-btn" class="worker-btn">
            <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="ring-bg"/><circle cx="50" cy="50" r="44" class="ring-fg" id="worker-ring"/></svg>
            <div class="worker-inner">
              <div class="w-title">働きネコ</div>
              <div class="w-lv">Lv.<span id="worker-lv">1</span></div>
              <div class="w-cost"><span id="worker-cost">0</span>円</div>
            </div>
          </button>
        </div>
        <div class="ctrl-center-frame">
          <div class="ctrl-center" id="deploy-slots"></div>
        </div>
        <div class="ctrl-right">
          <button id="cannon-btn" class="cannon-btn">
            <svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" class="ring-bg"/><circle cx="50" cy="50" r="44" class="ring-fg" id="cannon-ring"/></svg>
            <div class="cannon-inner">
              <div class="cannon-label">ネコ砲</div>
              <div class="cannon-state" id="cannon-state">CHARGE</div>
            </div>
          </button>
        </div>
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
